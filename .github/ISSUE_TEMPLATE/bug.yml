name: Баг
description: Что-то сломалось
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Что происходит
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидалось
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Где
      options:
        - localhost (dev)
        - Vercel
        - оба
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: "1. cd Server && npm run dev\n2. ..."
