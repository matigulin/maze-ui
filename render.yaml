# MAZE demo on Render — Blueprint
# Dashboard: https://dashboard.render.com/ → New → Blueprint → repo matigulin/maze-ui, branch dev

databases:
  - name: matigulin-maze-db
    plan: free
    region: frankfurt

services:
  - type: keyvalue
    name: matigulin-maze-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: matigulin-maze-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: Server
    branch: dev
    buildCommand: NPM_CONFIG_PRODUCTION=false npm install && npm run build && npm run db:migrate && (npm run db:seed || true)
    startCommand: npm start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: matigulin-maze-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: matigulin-maze-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AUTH_DEV_OTP
        value: "true"
      - key: CORS_ORIGIN
        value: https://matigulin-maze-web.onrender.com

  - type: web
    name: matigulin-maze-web
    runtime: node
    region: frankfurt
    plan: free
    rootDir: maze
    branch: dev
    buildCommand: NPM_CONFIG_PRODUCTION=false npm install && API_INTERNAL_URL=https://matigulin-maze-api.onrender.com npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api/v1
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: matigulin-maze-api
          envVarKey: RENDER_EXTERNAL_URL
