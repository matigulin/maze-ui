services:
  postgres:
    image: postgres:16-alpine
    container_name: maze-postgres
    environment:
      POSTGRES_USER: maze
      POSTGRES_PASSWORD: maze
      POSTGRES_DB: maze
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - maze_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maze -d maze']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: maze-redis
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  maze_pg_data:
